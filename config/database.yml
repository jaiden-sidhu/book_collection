# PostgreSQL database configuration
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: book_collection_development
  host: localhost
  username: postgres
  password: postgres

test:
  <<: *default
  database: book_collection_test
  host: localhost
  username: postgres
  password: postgres

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
